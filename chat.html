<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyro — Chat AI</title>
<meta name="description" content="Ngobrol dengan AI langsung dari portfolio Kyro.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>

<header class="topbar">
  <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="topbar-brand">KYRO<span class="dot">.</span>SYS</div>
  <div class="topbar-status"><span class="status-dot"></span>ONLINE</div>
</header>

<nav class="side-menu" id="sideMenu" aria-hidden="true">
  <button class="nav-close" id="navClose" aria-label="Tutup menu">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="menu-label">navigasi</div>
  <ul>
    <li><a href="/" class="nav-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a></li>
    <li><a href="/project" class="nav-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      Project
    </a></li>
    <li><a href="/chat" class="nav-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Chat AI
    </a></li>
  </ul>
  <div class="side-menu-foot">
    status: <span>online</span><br>
    asal: jambi, indonesia
  </div>
</nav>
<div class="overlay" id="navOverlay"></div>

<div class="chat-shell">
  <div class="chat-head">
    <div class="chat-head-title">
      <div class="chat-avatar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/></svg>
      </div>
      <div>
        <h1>Chat AI</h1>
        <div class="sub">xKiro · OpenRouter · Groq</div>
      </div>
    </div>
    <button class="chat-clear" id="chatClear">Bersihkan chat</button>
  </div>

  <div class="chat-stream" id="chatStream">
    <div class="chat-empty" id="chatEmpty">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Mulai percakapan dengan AI saya.
      <div class="chat-suggests">
        <button type="button" class="suggest-chip">Siapa itu Kyro?</button>
        <button type="button" class="suggest-chip">Apa itu Nova AI?</button>
        <button type="button" class="suggest-chip">Bantu aku belajar Node.js</button>
      </div>
    </div>
  </div>

  <form class="chat-input-bar" id="chatForm">
    <textarea id="chatInput" rows="1" placeholder="Tulis pertanyaan kamu..." required></textarea>
    <button type="submit" class="chat-send" id="chatSend" aria-label="Kirim pesan">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
  <div class="endpoint-tag">secure server API · Vercel</div>
</div>

<script src="js/nav.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
